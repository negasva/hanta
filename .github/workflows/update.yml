name: Actualizar predicciones

on:
  schedule:
    - cron: '0 5 * * *'   # 12:00am Colombia (UTC-5) = 05:00 UTC
  workflow_dispatch:        # trigger manual desde la interfaz de GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generar predicciones
        run: python3 predict.py

      - name: Publicar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html predicciones.txt data/predictions.json
          git diff --staged --quiet && echo "Sin cambios nuevos" || \
            (git commit -m "chore: predicciones $(date -u +'%Y-%m-%d')" && \
             git push origin HEAD)
